<!doctype html>
<html lang="tr" data-theme="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arhan Beyler</title>
<meta name="description" content="Arhan Beyler: projeler, oyunlar, uygulamalar ve mühendislik çalışmaları.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes/blueprint.css">
<script>
  // renk: ?palette= > kayıtlı seçim > siyah (göz almasın). Sayfa boyanmadan önce, renk sıçraması olmasın diye burada.
  (function () {
    var ok = ['paper', 'blue', 'dark'], q = new URLSearchParams(location.search).get('palette'), s = null;
    try { s = localStorage.getItem('palette'); } catch (e) {}
    document.documentElement.dataset.palette = ok.indexOf(q) >= 0 ? q : ok.indexOf(s) >= 0 ? s : 'dark';
  })();
</script>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-name" id="bg-name"></div>
  <div class="bg-role" id="bg-role"></div>
  <!-- el yazısı mühendislik notları (deneme): dile bağlı değil, yalnız formül ve ölçü -->
  <div class="sketch">
    <span class="hw n-sigma" style="left:29%;top:13%;--r:-4deg">σ = F / A</span>
    <span class="hw n-moment" style="left:57%;top:9%;--r:2deg">M = F · d</span>
    <span class="hw" style="left:47%;top:52%;--r:-2deg">SF ≥ 1.5 ✓</span>
    <span class="hw" style="left:53%;top:72%;--r:3deg">τ = T·r / J</span>
    <span class="hw sm" style="left:61%;top:40%;--r:-6deg">±0.05</span>
    <span class="hw sm" style="left:3%;top:45%;--r:-3deg">i = z₁ / z₂ = 2</span>
    <svg class="sk" style="left:22%;top:58%;width:230px" viewBox="0 0 230 110" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M20 40 Q115 36 210 41"/><path d="M28 42l-10 16h22zM202 43l-10 16h22z"/><path d="M14 64h32M188 64h32"/>
      <path d="M118 6v28M118 34l-5-9M118 34l5-9"/><text x="126" y="18">F</text>
      <path d="M28 86h174M28 80v12M202 80v12"/><text x="104" y="104">L</text>
    </svg>
    <svg class="sk" style="left:35%;top:22%;width:200px" viewBox="0 0 200 140" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M20 118 L52 40 L150 26 L178 118"/><path d="M14 118h170" stroke-dasharray="6 4"/>
      <circle cx="20" cy="118" r="4"/><circle cx="52" cy="40" r="4"/><circle cx="150" cy="26" r="4"/><circle cx="178" cy="118" r="4"/>
      <text x="22" y="78">a</text><text x="96" y="24">b</text><text x="170" y="74">c</text><text x="94" y="136">d</text>
    </svg>
    <svg class="sk" style="left:8%;top:76%;width:150px" viewBox="0 0 150 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="40" cy="30" r="20"/><path d="M14 30h52M40 4v52" stroke-dasharray="8 3 2 3"/>
      <path d="M62 14 L100 6"/><text x="104" y="10">Ø40 H7</text>
    </svg>
    <!-- gerilme-uzama eğrisi -->
    <svg class="sk" style="left:76%;top:50%;width:180px" viewBox="0 0 180 130" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M20 112V8M20 112h152M16 14l4-8 4 8M166 108l8 4-8 4"/>
      <path d="M20 112 L58 42 Q70 34 92 30 Q128 28 156 54"/><path d="M58 42H20" stroke-dasharray="4 4"/>
      <circle cx="92" cy="30" r="2.5"/>
      <text x="4" y="20">σ</text><text x="164" y="128">ε</text><text x="24" y="38">σy</text><text x="96" y="22">UTS</text>
    </svg>
    <!-- kama yuvalı mil kesiti -->
    <svg class="sk" style="left:6%;top:50%;width:110px" viewBox="0 0 110 125" fill="none" stroke="currentColor" stroke-width="1.5">
      <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v7" stroke="currentColor" stroke-width="1"/></pattern></defs>
      <path d="M49 18.5 A38 38 0 1 0 61 18.5 V28 H49 Z" fill="url(#hatch)"/>
      <text x="36" y="118">A–A</text>
    </svg>
    <!-- cıvata -->
    <svg class="sk" style="left:87%;top:70%;width:130px" viewBox="0 0 130 60" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M8 22h16v24H8zM8 30h16M8 38h16"/><path d="M24 28h90v12H24"/>
      <path d="M62 28l4 12M70 28l4 12M78 28l4 12M86 28l4 12M94 28l4 12M102 28l4 12M110 28l4 12"/>
      <text x="40" y="18">M6×20</text>
    </svg>
  </div>
</div>

<header class="menubar">
  <div class="mb-left">
    <span class="mb-name" id="mb-name"></span>
    <button id="lang" class="mb-btn" type="button" aria-label="Dil / Language">TR</button>
    <div id="palette" class="palette" role="group"></div>
  </div>
  <div class="mb-right">
    <a id="weather" class="mb-item" target="_blank" rel="noopener"></a>
    <span id="date" class="mb-item"></span>
    <span id="time" class="mb-item"></span>
  </div>
</header>

<div class="ruler" aria-hidden="true"></div>

<main id="desktop" class="desktop">
  <div id="gear-box" class="gear-box">
    <button id="gear" class="gear-btn" type="button" aria-pressed="false"><span id="gear-svg"></span><span class="lbl" id="gear-label"></span></button>
    <div class="track-ctl" id="track-ctl" hidden>
      <button id="prev" type="button">⏮</button>
      <button id="next" type="button">⏭</button>
    </div>
  </div>
</main>

<footer class="dock">
  <button id="start" class="start" type="button"><span id="start-label"></span> <span class="chev">‹</span></button>
  <div class="dock-right">
    <span id="coords" class="coords" aria-hidden="true"></span>
    <nav id="links" class="links"></nav>
  </div>
</footer>

<audio id="music" preload="none"></audio>

<script src="config.js"></script>
<script src="data/projects.js"></script>
<script src="app.js"></script>
</body>
</html>
